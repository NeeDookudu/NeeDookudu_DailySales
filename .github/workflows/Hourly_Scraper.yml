name: Hourly Collections Scraper

on:
  schedule:
    - cron: '0 * * * *' # Runs at minute 0 of every hour
  workflow_dispatch: # Allows manual triggering from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    
    env:
      SUPER_KEY: ${{ secrets.SUPER_KEY }}
      ENC_KEY: ${{ secrets.ENC_KEY }}

    steps:
      # 1. NEW STEP: Free up disk space by removing massive unused pre-installed tools (Android SDK, .NET, etc.)
      - name: Free Disk Space (Ubuntu)
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo apt-get clean

      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          # 2. FIX: Change this to 1. You only need the latest files to run the scraper, not the whole history.
          fetch-depth: 1 

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install playwright requests cryptography curl_cffi

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Create data directories
        run: |
          mkdir -p data
          mkdir -p encoded_data

      - name: 1. Run BMS Fetcher
        run: python BMSLIVERUN.py

      - name: 2. Run District Fetcher
        run: python DistrictLiveRun.py

      - name: 3. Run Merger
        run: python MergerRun.py

      - name: 4. Encrypt Merged Data
        run: python encryptor.py

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/ encoded_data/

          if [ -n "$(git status --porcelain)" ]; then
            git commit -m "Update collections data and encrypted payloads: $(date -u +'%Y-%m-%d %H:%M UTC')"
            # Note: Changed to standard pull to avoid rebase conflicts on a shallow (fetch-depth: 1) clone
            git push || (git pull --no-rebase origin main && git push)
          else
            echo "No changes to commit"
          fi
